services:
  importer:
    build: ./Importer
    container_name: importer-service
    expose:
      - "5001"
    networks:
      - sparql-network
    restart: unless-stopped
    environment:
      - SPARQL_BACKEND_URL=http://sparql-backend:8080
    volumes:
      - importer-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  visualizer:
    build: ./Visualization
    container_name: visualizer-service
    expose:
      - "5000"
    networks:
      - sparql-network
    restart: unless-stopped
    environment:
      - SPARQL_BACKEND_URL=http://sparql-backend:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sparql-backend:
    build: ./Sparql-Backend
    container_name: sparql-backend-service
    expose:
      - "8080"
    networks:
      - sparql-network
    restart: unless-stopped

  frontend:
    build:
        context: ./Frontend
        dockerfile: Dockerfile
        args:
            VITE_SPARQL_BACKEND_URL: /api/sparql-backend
            VITE_IMPORTER_URL: /api/importer
            VITE_VISUALIZER_URL: /api/visualizer
    container_name: frontend-service
    ports:
        - "80:80"
    restart: unless-stopped
    networks:
        - sparql-network

networks:
  sparql-network:
    driver: bridge
volumes:
  importer-data:
