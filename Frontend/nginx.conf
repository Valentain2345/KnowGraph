events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # -------------------------------------------------------------
        # API Proxying – these routes forward requests to your backends
        # -------------------------------------------------------------

        # Forward requests starting with /api/sparql/ to the sparql-backend service
        location /api/sparql/ {
            proxy_pass http://sparql-backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward requests starting with /api/importer/ to the importer service
        location /api/importer/ {
            proxy_pass http://importer:5001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward requests starting with /api/visualizer/ to the visualizer service
        location /api/visualizer/ {
            proxy_pass http://visualizer:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # Static file serving – for the React SPA
        # -------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Optional: cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
